name: Android CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v2
      
    - name: Set up JDK 21
      uses: actions/setup-java@v2
      with:
        distribution: 'zulu'
        java-version: '21'
        
    - name: Setup Google Services
      run: echo '${{ secrets.GOOGLE_SERVICES_JSON }}' > app/google-services.json
    
    - name: Install pngquant
      run: sudo apt-get install -y pngquant
    
    - name: Optimize problematic PNG
      run: pngquant --quality=65-80 --strip --force --ext .png app/src/main/res/drawable/ouest_forge_game.png
      continue-on-error: false
        
    - name: Download dependencies
      run: ./gradlew build --info --stacktrace
      
    - name: Build APK
      run: ./gradlew assembleRelease --info --stacktrace
      
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-release.apk
        path: app/build/outputs/apk/release/app-release.apk
